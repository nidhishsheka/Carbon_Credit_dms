{% extends "base.html" %}

{% block content %}

<h2>Emission Records</h2>

<table>

<tr>
<th>Entity</th>
<th>Source</th>
<th>Quantity</th>
<th>Factor</th>
<th>Emission</th>
</tr>

{% for row in records %}
<tr>
<td>{{ row.entity_name }}</td>
<td>{{ row.source_name }}</td>
<td>{{ row.quantity }}</td>
<td>{{ row.factor_value }}</td>
<td>{{ row.emission }}</td>
</tr>
{% endfor %}

</table>

{% endblock %}
